services:
  - type: web
    name: synthesisone-whatsapp-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: ADMIN_SECRET
        sync: false
      - key: SYNTHESISONE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: whatsapp-sessions
      - key: WHATSAPP_SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "53"
      - key: WHATSAPP_AUTH_DIR
        value: /tmp/.wwebjs_auth
      - key: WHATSAPP_CLIENT_ID
        value: synthesisone
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: WHATSAPP_BACKUP_SYNC_INTERVAL_MS
        value: "300000"
      - key: WEBHOOK_TIMESTAMP_TOLERANCE_SEC
        value: "300"
      - key: MAX_WEBHOOK_BODY_BYTES
        value: "131072"
      - key: LICENSE_PRICE_AMOUNT
        value: "28000"
      - key: LICENSE_CURRENCY
        value: CUP
      - key: LICENSE_RECEIVER_ACCOUNTS
        sync: false
      - key: CUBA_ONLY_RECIPIENTS
        value: "false"
      - key: KEEPALIVE_TOKEN
        generateValue: true
      - key: KEEPALIVE_PATH
        value: /wake

  - type: cron
    name: synthesisone-whatsapp-wakeup
    runtime: node
    plan: 0.5c-512mb
    schedule: "*/5 * * * *"
    buildCommand: npm install --omit=optional
    startCommand: node src/keepalive.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: KEEPALIVE_TARGET_URL
        fromService:
          type: web
          name: synthesisone-whatsapp-bot
          envVarKey: RENDER_EXTERNAL_URL
      - key: KEEPALIVE_TOKEN
        fromService:
          type: web
          name: synthesisone-whatsapp-bot
          envVarKey: KEEPALIVE_TOKEN
      - key: KEEPALIVE_PATH
        value: /wake
